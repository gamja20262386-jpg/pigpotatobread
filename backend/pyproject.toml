[project]
name = "jejueat-backend"
version = "0.1.0"
description = "제주잇 백엔드: FastAPI + 하르방 에이전트 하네스"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn", "sqlalchemy>=2", "pydantic>=2", "httpx", "pyyaml", "pyjwt>=2.8"]

[project.optional-dependencies]
claude = ["anthropic"]      # LLM_PROVIDER=claude 일 때만 필요(지연 import)
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
